plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

// --- Recursos generados por tools/gen (estructuras, pools, botín, funciones, textos) ---
// Registros de 26.3 para validar: -Pmcmeta_summary=<ruta>, variable MCMETA_SUMMARY o clon automático en build/.
// No se suben al repositorio porque son datos de Mojang.
def mcmetaOverride = providers.gradleProperty('mcmeta_summary').orElse(providers.environmentVariable('MCMETA_SUMMARY'))
def mcmetaDir = mcmetaOverride.map { file(it) }.orElse(layout.buildDirectory.dir('mcmeta-summary').map { it.asFile })
def generatedDir = layout.buildDirectory.dir('generated/heraldia')

def fetchRegistries = tasks.register('fetchRegistries', Exec) {
	description = 'Clona el resumen de registros de misode/mcmeta si no se ha indicado otro.'
	def target = mcmetaDir.get()
	def branch = project.mcmeta_summary_branch
	onlyIf { !new File(target, 'registries/data.json').isFile() }
	// `clean build`: the clone lives in build/, which clean deletes, and this task declares no outputs, so nothing else
	// orders it after clean. With parallel builds its onlyIf was read before clean ran (the clone still there: skipped)
	// and generateStructures then found no registries. After clean, the check sees what clean left.
	mustRunAfter tasks.named('clean')
	commandLine 'git', '-c', 'advice.detachedHead=false', 'clone', '--quiet', '--depth', '1', '--branch', branch,
			'https://github.com/misode/mcmeta.git', target.absolutePath
}

def generateStructures = tasks.register('generateStructures', Exec) {
	description = 'Genera, valida y audita las estructuras con tools/gen; falla ante cualquier aviso.'
	dependsOn fetchRegistries
	// sin las pruebas unitarias ni la caché de bytecode: tocarlas no obliga a regenerar el datapack
	inputs.files(fileTree('tools/gen') { exclude 'tests/**', '**/__pycache__/**', '**/.pytest_cache/**' })
			.withPropertyName('generator')
	outputs.dir(generatedDir)
	def out = generatedDir.get().asFile
	commandLine project.python, '-I', file('tools/gen/main.py').absolutePath,
			'--out', out.absolutePath, '--registries', mcmetaDir.get().absolutePath
}

sourceSets.main.resources.srcDir(generateStructures)

// Código de cliente (pantalla de configuración) en su propio source set: el servidor dedicado nunca carga sus clases
// y Loom impide que el código común las use.
loom {
	splitEnvironmentSourceSets()
	mods {
		heraldia {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	// Mod Menu (opcional, solo para compilar su punto de entrada; no va dentro del .jar)
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	// Mapas web (opcionales, solo para compilar sus adaptadores en mapas/<mapa>/; no van dentro del .jar). squaremap-api
	// está en Maven Central.
	maven {
		name = 'BlueColored'
		url = 'https://repo.bluecolored.de/releases'
		content { includeGroup 'de.bluecolored' }
	}
	maven {
		name = 'Dynmap'
		url = 'https://repo.mikeprimm.com/'
		content { includeGroup 'us.dynmap' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	// API de los mapas web: solo para compilar; en el servidor las pone cada mapa (mapas/MapasWeb solo carga su adaptador
	// si el mod está). Sin transitivas: los adaptadores no usan nada más de ellas (squaremap trae Adventure; BlueMap, flow-math).
	// (versiones aquí y no en gradle.properties, que mueve las pruebas de compatibilidad)
	compileOnly("de.bluecolored:bluemap-api:2.8.2") { transitive = false }
	compileOnly("xyz.jpenilla:squaremap-api:1.4.3") { transitive = false }
	compileOnly("us.dynmap:DynmapCoreAPI:3.8") { transitive = false }
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Pruebas unitarias (JUnit) con las clases del juego en el classpath: p. ej. la separación entre estructuras únicas.
// Las simulaciones largas (minutos) van en su propia tarea, testPesado: ./gradlew build (check) pasa las dos; la CI
// pasa testPesado en un job aparte, a la vez que el resto, para que no alargue la compilación.
def junitPesadas = ['io.github.albertosa23.heraldia.config.UniqueSeparationTest', 'io.github.albertosa23.heraldia.config.MediumDensityComparisonTest', 'io.github.albertosa23.heraldia.mines.MinesDeterminismTest']
test {
	useJUnitPlatform()
	systemProperty 'heraldia.generated', generatedDir.get().asFile.absolutePath
	systemProperty 'heraldia.mcmeta', mcmetaDir.get().absolutePath
	dependsOn fetchRegistries
	testLogging { events 'failed'; showStandardStreams = true; exceptionFormat = 'full' }
	filter { junitPesadas.each { excludeTestsMatching it } }
}

def testPesado = tasks.register('testPesado', Test) {
	description = 'Pruebas JUnit largas (separación entre únicas con muchas semillas; minas con el terreno real de 26.3).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	systemProperty 'heraldia.generated', generatedDir.get().asFile.absolutePath
	testLogging { events 'failed'; showStandardStreams = true; exceptionFormat = 'full' }
	filter { junitPesadas.each { includeTestsMatching it } }
	mustRunAfter tasks.named('test')
}

// Tests unitarios del generador (pytest, tools/gen/tests): segundos, sin generar el datapack ni tocar el juego.
def testGen = tasks.register('testGen', Exec) {
	description = 'Tests unitarios del generador en Python (pytest): python3 -m pytest tools/gen/tests'
	group = 'verification'
	inputs.files(fileTree('tools/gen') { exclude '**/__pycache__/**', '**/.pytest_cache/**' }).withPropertyName('generator')
	inputs.file('tools/test.py').withPropertyName('selector')
	def marker = layout.buildDirectory.file('test-results/testGen/ok').get().asFile
	outputs.file(marker)
	commandLine project.python, '-m', 'pytest', '-q', '-p', 'no:cacheprovider', file('tools/gen/tests').absolutePath
	doLast { marker.parentFile.mkdirs(); marker.text = 'ok' }
}

tasks.named('check') { dependsOn testGen, testPesado }

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version,
				 loader_version: project.loader_version, java_version: project.java_version]
	inputs.properties props
	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
}
