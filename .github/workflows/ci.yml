name: CI

# Comprobaciones de cada PR contra develop o main, de cada push a develop y a mano (workflow_dispatch).
# No publica nada (la publicación es .github/workflows/publish.yml, en main).
#
# Política de pruebas (docs/DEVELOPMENT.md): en un PR van la compilación, todos los tests unitarios, la prueba de humo
# y solo las pruebas de servidor afectadas por los ficheros cambiados (tools/test.py, el mismo mapa de rutas que en
# local). La batería completa va en cada push a develop, a mano (la sesión auditora) y en un PR con la etiqueta
# «bateria-completa» o con «[bateria completa]» en el título. Las de compatibilidad con otros mods
# (tools/smoke/compat_mods.py) van en la batería completa y en un PR solo si tocan compatibilidad o colocación.
# El coste de generación (tools/smoke/generation_cost.py, job «coste») va en la batería completa y en un PR solo si
# toca el Java de la generación o el generador (tools/test.py, COST_PATHS), a la vez que los grupos de servidor. El coste de
# jugar (tools/smoke/runtime_cost.py, job «juego») igual, si toca lo que corre al jugar o lo que llevan las aldeas (RUNTIME_PATHS).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seleccion:
    name: Tests unitarios del generador y pruebas que tocan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matriz: ${{ steps.sel.outputs.matriz }}
      hay: ${{ steps.sel.outputs.hay }}
      coste: ${{ steps.sel.outputs.coste }}
      juego: ${{ steps.sel.outputs.juego }}
      coste_razon: ${{ steps.sel.outputs.coste_razon }}
      juego_razon: ${{ steps.sel.outputs.juego_razon }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # la base del PR, para saber qué ha cambiado

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/gen/requirements.txt

      - name: Instalar dependencias del generador
        run: pip install -r tools/gen/requirements.txt

      # el resumen de registros de 26.3 (como fetchRegistries en Gradle): sin él, las pruebas que construyen el registro
      # entero (test_filler_loot: ningún contenedor sin botín) se saltarían
      - name: Resumen de registros de 26.3 (misode/mcmeta)
        run: git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$(sed -n 's/^mcmeta_summary_branch=//p' gradle.properties)" https://github.com/misode/mcmeta.git build/mcmeta-summary

      - name: Tests unitarios del generador (pytest)
        run: python3 -m pytest -q -p no:cacheprovider tools/gen/tests

      - name: Elegir las pruebas de servidor
        id: sel
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TITULO: ${{ github.event.pull_request.title }}
          ETIQUETAS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$EVENTO" != "pull_request" ] || echo "$ETIQUETAS" | grep -q '"bateria-completa"' \
             || echo "$TITULO" | grep -qi '\[bateria completa\]'; then
            m=$(python3 tools/test.py --ci-matrix --full)
          else
            m=$(python3 tools/test.py --ci-matrix --base "$BASE")
          fi
          echo "$m" | python3 -c 'import json,sys; m=json.load(sys.stdin); print("Batería completa" if m["full"] else "Pruebas afectadas"); [print(" -", g["tests"]) for g in m["include"]]; print("Coste de generación:", "sí" if m["cost"] else "no", "-", m["cost_reason"]); print("Coste de jugar:", "sí" if m["runtime"] else "no", "-", m["runtime_reason"])'
          echo "matriz=$(echo "$m" | python3 -c 'import json,sys; m=json.load(sys.stdin); print(json.dumps({"include": m["include"]}))')" >> "$GITHUB_OUTPUT"
          echo "hay=$(echo "$m" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin)["include"] else "false")')" >> "$GITHUB_OUTPUT"
          echo "coste=$(echo "$m" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin)["cost"] else "false")')" >> "$GITHUB_OUTPUT"
          echo "juego=$(echo "$m" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin)["runtime"] else "false")')" >> "$GITHUB_OUTPUT"
          echo "coste_razon=$(echo "$m" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cost_reason"])')" >> "$GITHUB_OUTPUT"
          echo "juego_razon=$(echo "$m" | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime_reason"])')" >> "$GITHUB_OUTPUT"

  compilar:
    name: Compilación (genera, valida, audita y JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar

      - name: Leer versión y rama de mcmeta
        id: ver
        run: |
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mcmeta=$(grep '^mcmeta_summary_branch=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Resumen de registros de misode/mcmeta (datos de Mojang: nunca en el repositorio). build.gradle solo lo clona si falta.
      - uses: actions/cache@v4
        with:
          path: build/mcmeta-summary
          key: mcmeta-${{ steps.ver.outputs.mcmeta }}

      - name: Registro de cambios
        run: python3 tools/changelog.py check

      # testGen (pytest) va en «seleccion» y testPesado en su propio job, a la vez que este.
      - name: Compilar (genera, valida, audita y pasa JUnit)
        run: ./gradlew build -x testGen -x testPesado --build-cache

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/heraldia-${{ steps.ver.outputs.version }}.jar
          retention-days: 7

  junit-pesado:
    name: JUnit largas (separación entre únicas)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar

      - name: Leer rama de mcmeta
        id: ver
        run: echo "mcmeta=$(grep '^mcmeta_summary_branch=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: build/mcmeta-summary
          key: mcmeta-${{ steps.ver.outputs.mcmeta }}

      - name: Pruebas JUnit largas (testPesado)
        run: ./gradlew testPesado --build-cache

  humo:
    name: Prueba de humo en servidor dedicado
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar
        with:
          gradle: 'false'

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: build/libs

      # La prueba de la Atlántida (tools/gen/uniques/atlantis/smoke.py) rehace su plano, que valida contra los registros de mcmeta.
      - name: Leer rama de mcmeta
        id: ver
        run: echo "mcmeta=$(grep '^mcmeta_summary_branch=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: build/mcmeta-summary
          key: mcmeta-${{ steps.ver.outputs.mcmeta }}

      - name: Resumen de mcmeta (si no estaba en caché)
        run: |
          [ -f build/mcmeta-summary/registries/data.json ] || git -c advice.detachedHead=false clone --quiet --depth 1 \
            --branch "${{ steps.ver.outputs.mcmeta }}" https://github.com/misode/mcmeta.git build/mcmeta-summary

      # server_smoke.py lee build/generated (estructuras, logros, tablas, heraldia/llaves.json): son los ficheros que lleva el .jar.
      - name: Datos generados (del .jar)
        run: |
          mkdir -p build/generated/heraldia
          unzip -q -o build/libs/heraldia-${{ needs.compilar.outputs.version }}.jar -x '*.class' 'META-INF/*' -d build/generated/heraldia

      - name: Prueba de humo
        run: python3 tools/smoke/server_smoke.py --jar build/libs/heraldia-${{ needs.compilar.outputs.version }}.jar --work "$GITHUB_WORKSPACE/build/smoke"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-prueba-de-humo
          path: build/smoke/logs/latest.log
          if-no-files-found: ignore

  servidor:
    name: Servidor · ${{ matrix.name }}
    needs: [compilar, seleccion]
    if: needs.seleccion.outputs.hay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Grupos de tools/test.py: las pruebas cortas van juntas en un job (en serie) mientras el grupo no pase de la
      # más larga. Las pruebas se descubren solas (tools/smoke/*.py y tools/gen/uniques/*/smoke_*.py, con --jar y --work).
      # Las de compatibilidad con otros mods (compat_mods.py, una por grupo de mods) solo van en un PR si cambian sus
      # ficheros o el código común de colocación (tools/test.py, COMPAT_PATHS); en push a develop y a mano, siempre.
      matrix: ${{ fromJSON(needs.seleccion.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar
        with:
          gradle: 'false'

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: build/libs

      # Mods de Modrinth de las pruebas (tools/smoke/modrinth.py: Carpet, Terralith, los de compatibilidad...): cada
      # prueba los descarga en build/smoke/modrinth y comprueba su sha512. Una caché por grupo (cada uno descarga solo
      # los suyos) que empieza desde la de cualquier otro; la clave cambia si cambia la lista fijada.
      - name: Clave de la caché de mods
        id: mods
        run: echo "grupo=$(echo '${{ matrix.name }}' | tr -c 'a-zA-Z0-9_\n' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: build/smoke/modrinth
          key: modrinth-${{ hashFiles('tools/smoke/modrinth.py') }}-${{ steps.mods.outputs.grupo }}
          restore-keys: |
            modrinth-${{ hashFiles('tools/smoke/modrinth.py') }}-
            modrinth-

      # Todas en build/smoke para compartir la caché del servidor Fabric. Ruta absoluta: los scripts arrancan el
      # servidor con cwd=--work, así que una ruta relativa al lanzador no se encontraría.
      - name: Pruebas
        run: python3 tools/test.py --group "${{ matrix.tests }}" --jar build/libs/heraldia-${{ needs.compilar.outputs.version }}.jar --work "$GITHUB_WORKSPACE/build/smoke" --logs build/logs-pruebas

      - name: Nombre del artefacto
        if: failure()
        id: nombre
        run: echo "nombre=logs-$(echo '${{ matrix.name }}' | tr ' /.+' '----' | tr -s '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ steps.nombre.outputs.nombre }}
          path: build/logs-pruebas
          if-no-files-found: ignore

  # El job corre siempre que corran compilar y seleccion, también cuando la selección dice que no hace falta medir: entonces
  # no mide, lo dice («saltado por ruta» en el nombre y la razón) y sale en verde. Así un job saltado por ruta, uno que midió
  # y uno que arrancó y murió se leen distinto desde fuera: su último paso (Veredicto, tools/cost_status.py) deja UNA
  # anotación «COST-VERDICT coste MEASURED|SKIPPED|DIED» en el check run, y un check run terminado sin ella es que el runner
  # se perdió antes de llegar ahí. Para leerlo sin bajar nada: python3 tools/cost_status.py ci --repo OWNER/REPO --sha SHA.
  coste:
    name: Coste de generación (con y sin Heraldia)${{ needs.seleccion.outputs.coste == 'false' && ' · saltado por ruta' || '' }}
    needs: [compilar, seleccion]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIDE: ${{ needs.seleccion.outputs.coste }}
      PYTHONUNBUFFERED: '1'        # la salida llega al log del job según se escribe, no al vaciarse el búfer (se perdía al matarlo)
    steps:
      - uses: actions/checkout@v4

      - name: Saltado por ruta
        if: env.MIDE == 'false'
        env:
          RAZON: ${{ needs.seleccion.outputs.coste_razon }}
        run: python3 tools/cost_status.py skip --job coste --output build/coste --reason "$RAZON"

      - uses: ./.github/actions/preparar
        if: env.MIDE == 'true'
        with:
          gradle: 'false'

      - uses: actions/download-artifact@v4
        if: env.MIDE == 'true'
        with:
          name: jar
          path: build/libs

      # Chunky (tools/smoke/modrinth.py), con su sha512
      - uses: actions/cache@v4
        if: env.MIDE == 'true'
        with:
          path: build/smoke/modrinth
          key: modrinth-${{ hashFiles('tools/smoke/modrinth.py') }}-coste
          restore-keys: |
            modrinth-${{ hashFiles('tools/smoke/modrinth.py') }}-
            modrinth-

      # Misma zona del mismo mundo con y sin Heraldia (3 pasadas de cada); compara con tools/smoke/cost_reference.json
      # y escribe el resumen del job. Para actualizar la referencia con esta medición: docs/DEVELOPMENT.md. Desde su
      # arranque escribe build/coste/estado.json y progreso.log, el log de cada pasada (logs/) y las pasadas ya medidas
      # (coste_generacion.parcial.json): lo que haya hecho queda aunque lo maten.
      - name: Coste de generación
        id: medir
        if: env.MIDE == 'true'
        run: python3 tools/smoke/generation_cost.py --jar build/libs/heraldia-${{ needs.compilar.outputs.version }}.jar --work "$GITHUB_WORKSPACE/build/smoke" --output build/coste

      # Antes era `cp ... 2>/dev/null || true`: si el job moría antes de crear build/coste, el cp fallaba en silencio, el paso
      # salía en verde y no se subía nada (CI 44965032309, juego muerto en 18 s). Ahora dice qué rescata, o falla a la vista.
      - name: Log del servidor
        if: always() && env.MIDE == 'true'
        run: |
          mkdir -p build/coste
          if [ -f build/smoke/logs/latest.log ]; then
            cp build/smoke/logs/latest.log build/coste/
            echo "rescued build/smoke/logs/latest.log ($(wc -l < build/smoke/logs/latest.log) lines) into build/coste/"
          else
            echo "::error title=Log del servidor::no server log to rescue: build/smoke/logs/latest.log does not exist (the server never started)"
            exit 1
          fi

      - name: Veredicto
        if: always()
        run: python3 tools/cost_status.py verdict --job coste --output build/coste --step-outcome "${{ steps.medir.outcome }}"

      - uses: actions/upload-artifact@v4
        if: always() && env.MIDE == 'true'
        with:
          name: coste-generacion
          path: build/coste
          if-no-files-found: error      # build/coste always holds at least estado.json or veredicto.txt
          retention-days: 30

  # Coste de jugar (tools/smoke/runtime_cost.py): tiempo por tick con jugadores simulados en aldeas, la arena y una caravana,
  # con y sin Heraldia, y el margen de aldeanos; compara con tools/smoke/runtime_reference.json (docs/DEVELOPMENT.md).
  # Como «coste»: corre siempre, mide sólo si la selección lo pide y su último paso deja una anotación COST-VERDICT juego.
  juego:
    name: Coste de jugar (tiempo por tick con y sin Heraldia)${{ needs.seleccion.outputs.juego == 'false' && ' · saltado por ruta' || '' }}
    needs: [compilar, seleccion]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIDE: ${{ needs.seleccion.outputs.juego }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Saltado por ruta
        if: env.MIDE == 'false'
        env:
          RAZON: ${{ needs.seleccion.outputs.juego_razon }}
        run: python3 tools/cost_status.py skip --job juego --output build/juego --reason "$RAZON"

      - uses: ./.github/actions/preparar
        if: env.MIDE == 'true'
        with:
          gradle: 'false'

      - uses: actions/download-artifact@v4
        if: env.MIDE == 'true'
        with:
          name: jar
          path: build/libs

      # Chunky y Carpet (tools/smoke/modrinth.py), con su sha512
      - uses: actions/cache@v4
        if: env.MIDE == 'true'
        with:
          path: build/smoke/modrinth
          key: modrinth-${{ hashFiles('tools/smoke/modrinth.py') }}-juego
          restore-keys: |
            modrinth-${{ hashFiles('tools/smoke/modrinth.py') }}-
            modrinth-

      - name: Coste de jugar
        id: medir
        if: env.MIDE == 'true'
        run: python3 tools/smoke/runtime_cost.py --jar build/libs/heraldia-${{ needs.compilar.outputs.version }}.jar --work "$GITHUB_WORKSPACE/build/smoke" --output build/juego

      # Antes era `cp ... 2>/dev/null || true`: si el job moría antes de crear build/juego, el cp fallaba en silencio, el paso
      # salía en verde y no se subía nada (CI 44965032309, juego muerto en 18 s). Ahora dice qué rescata, o falla a la vista.
      - name: Log del servidor
        if: always() && env.MIDE == 'true'
        run: |
          mkdir -p build/juego
          if [ -f build/smoke/logs/latest.log ]; then
            cp build/smoke/logs/latest.log build/juego/
            echo "rescued build/smoke/logs/latest.log ($(wc -l < build/smoke/logs/latest.log) lines) into build/juego/"
          else
            echo "::error title=Log del servidor::no server log to rescue: build/smoke/logs/latest.log does not exist (the server never started)"
            exit 1
          fi

      - name: Veredicto
        if: always()
        run: python3 tools/cost_status.py verdict --job juego --output build/juego --step-outcome "${{ steps.medir.outcome }}"

      - uses: actions/upload-artifact@v4
        if: always() && env.MIDE == 'true'
        with:
          name: coste-juego
          path: build/juego
          if-no-files-found: error      # build/juego always holds at least estado.json or veredicto.txt
          retention-days: 30
